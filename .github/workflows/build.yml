name: Build Tweak

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "iOS SDK Version"
        default: "16.5"
        required: true
        type: string
      target_version:
        description: "Target iOS Version"
        default: "15.0"
        required: true
      deploy_format:
        description: "Deployment format"
        default: sideloaded
        required: true
        type: choice
        options:
          - rootfull
          - sideloaded
          - trollstore
          - rootless
      twitter_branding:
        description: "Set app name to Twitter (IPA builds only)"
        default: true
        required: false
        type: boolean
      resource_pack_url:
        description: "Override app icons (.ZIP) (IPA builds only)"
        default: "https://files.catbox.moe/p63f20.zip"
        required: false
        type: string
      commit_id:
        description: "(Optional) Commit ID to build at"
        default: ""
        required: false
        type: string
      create_release:
        description: "Create a draft release (private until published)"
        default: true
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Tweak
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Main
        uses: actions/checkout@v6
        with:
          path: main
          ref: ${{ github.event.inputs.commit_id || github.ref }}
          submodules: recursive

      - name: Install Dependencies
        run: brew install make dpkg ldid

      - name: Add GNU Make to PATH
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Download Theos
        uses: actions/checkout@v6
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      - name: Install cyan
        if: inputs.deploy_format == 'sideloaded' || inputs.deploy_format == 'trollstore'
        run: pip install https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: iOS SDK Caching
        id: SDK
        uses: actions/cache@v6
        env:
          cache-name: iOS-${{ inputs.sdk_version }}-SDK
        with:
          path: theos/sdks/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Download iOS SDK
        if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks/
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS${{ inputs.sdk_version }}.sdk
          git checkout
          mv ./*.sdk "${THEOS}/sdks"
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Get Tweak Info
        id: tweak_info
        run: |
          TWEAK_NAME=$(sed -n 's/^Name: *//p' main/control)
          TWEAK_VERSION=$(awk '/Version:/ {print $2}' main/control)
          echo "name=${TWEAK_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${TWEAK_VERSION}" >> "$GITHUB_OUTPUT"
          echo "$TWEAK_NAME $TWEAK_VERSION"

      - name: Validate private base IPA URL
        if: inputs.deploy_format == 'sideloaded' || inputs.deploy_format == 'trollstore'
        env:
          IPA_URL: ${{ secrets.NFB_DECRYPTED_IPA_URL }}
        run: |
          if [ -z "$IPA_URL" ]; then
            echo "::error::Set the repository secret NFB_DECRYPTED_IPA_URL to a private direct-download IPA URL."
            exit 1
          fi

      - name: Prepare X IPA
        if: inputs.deploy_format == 'sideloaded' || inputs.deploy_format == 'trollstore'
        id: x_version
        run: |
          IPA_PATH="main/packages/com.atebits.Tweetie2.ipa"
          HTTP_META=$(curl --silent --show-error --location --fail --retry 2 \
            --output "$IPA_PATH" --write-out "%{http_code} %{content_type}" "$IPA_URL") || {
              CURL_STATUS=$?
              echo "::error::IPA download failed (curl exit ${CURL_STATUS}; HTTP ${HTTP_META:-unknown}). Set the Secret to an anonymous direct-download link."
              exit "$CURL_STATUS"
          }
          printf 'IPA download HTTP/content-type: %s; bytes: %s\\n' "$HTTP_META" "$(wc -c < "$IPA_PATH" | tr -d ' ')"
          if ! unzip -tq "$IPA_PATH" >/dev/null; then
            echo "::error::Download response is not a valid ZIP/IPA. Check that the URL returns the IPA file directly."
            exit 1
          fi
          unzip -q "$IPA_PATH" -d main/tmp
          INFO_PLIST="main/tmp/Payload/Twitter.app/Info.plist"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")
          X_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")
          if [ "$BUNDLE_ID" != "com.atebits.Tweetie2" ]; then
            echo "::error::Expected bundle ID com.atebits.Tweetie2, got $BUNDLE_ID."
            exit 1
          fi
          if [ "$X_VERSION" != "12.42.1" ]; then
            echo "::error::Expected X version 12.42.1, got $X_VERSION."
            exit 1
          fi
          echo "version=${X_VERSION}" >> "$GITHUB_OUTPUT"
          echo "$X_VERSION"
        env:
          IPA_URL: ${{ secrets.NFB_DECRYPTED_IPA_URL }}

      - name: Prepare Image Pack
        if: inputs.resource_pack_url != '' && (inputs.deploy_format == 'sideloaded' || inputs.deploy_format == 'trollstore')
        run: |
          wget "$IMAGE_URL" --no-verbose -O main/resource-pack.zip
        env:
          IMAGE_URL: ${{ inputs.resource_pack_url }}

      - name: Compute ffmpeg Cache Key
        id: ffmpeg-key
        run: |
          echo "key=ffmpeg-stack-sdk$(xcrun --sdk iphoneos --show-sdk-version)-$(git -C main rev-parse --short HEAD:deps/ffmpeg-kit-next/upstream)-${{ hashFiles('main/deps/ffmpeg-kit-next/build-ffmpeg.sh') }}" >> "$GITHUB_OUTPUT"

      - name: ffmpeg Stack Caching
        uses: actions/cache@v6
        with:
          path: |
            ffmpeg-build
            main/deps/ffmpeg-kit-next/build
          key: ${{ steps.ffmpeg-key.outputs.key }}

      - name: Build Package
        run: |
          cd ${{ github.workspace }}/main
          sed -i '' "s/^TARGET.*$/TARGET := iphone:clang:${{ inputs.sdk_version }}:${{ inputs.target_version }}/" Makefile
          ./build.sh --${{ inputs.deploy_format }}
        env:
          THEOS: ${{ github.workspace }}/theos
          BUILD_DIR: ${{ github.workspace }}/ffmpeg-build

      - name: Rebrand IPA
        if: (inputs.deploy_format == 'sideloaded' || inputs.deploy_format == 'trollstore') && (inputs.twitter_branding || inputs.resource_pack_url != '')
        run: |
          cd ${{ github.workspace }}/main
          IMAGE_FLAG=""
          if [ -f resource-pack.zip ]; then IMAGE_FLAG="--resource-pack resource-pack.zip"; fi
          ./rebrand.sh${{ inputs.twitter_branding && ' --twitter-branding' || '' }} $IMAGE_FLAG \
            "packages/$(ls -t packages | head -n1)"

      - name: Rename IPA to include IPA version
        if: inputs.deploy_format == 'sideloaded' || inputs.deploy_format == 'trollstore'
        run: |
          mv "main/packages/$(ls -t main/packages | head -n1)" \
             "main/packages/${{ steps.tweak_info.outputs.name }}-${BRANDING}-${{ inputs.deploy_format }}_${{ steps.tweak_info.outputs.version }}_${{ steps.x_version.outputs.version }}.${IPA_EXT}"
        env:
          IPA_EXT: ${{ inputs.deploy_format == 'trollstore' && 'tipa' || 'ipa' }}
          BRANDING: ${{ inputs.twitter_branding && 'Twitter' || 'X' }}

      - name: Pass package name
        id: package_name
        run: |
          echo "package=$(ls -t main/packages | head -n1)" >> "$GITHUB_OUTPUT"


      - name: Create Draft Release
        if: ${{ inputs.create_release }}
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.tweak_info.outputs.version }}
          name: v${{ steps.tweak_info.outputs.version }} - ${{ steps.tweak_info.outputs.name }}
          files: main/packages/${{ steps.package_name.outputs.package }}
          draft: true
